# Giữ Supabase (gói free) không bị tạm dừng: gọi /api/keep-alive 3 ngày một lần.
# Cần thêm 2 secrets trong GitHub repo → Settings → Secrets and variables → Actions:
#   SITE_URL          = https://tenban.vercel.app
#   KEEP_ALIVE_SECRET = (giống giá trị KEEP_ALIVE_SECRET trong Vercel)
name: keep-alive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/keep-alive
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          KEEP_ALIVE_SECRET: ${{ secrets.KEEP_ALIVE_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 -H "x-keep-alive-secret: $KEEP_ALIVE_SECRET" "${SITE_URL%/}/api/keep-alive"
